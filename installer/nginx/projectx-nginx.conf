# ─────────────────────────────────────────────────────────────────────────────
# ProjectX — nginx reverse proxy (Windows)
#
# Fronts the ProjectX backend (Kestrel, bound to loopback 127.0.0.1) and exposes
# the app on the LAN over HTTPS. nginx listens on every interface so the app is
# reachable by the server's LAN IP (e.g. https://192.0.0.200), while Kestrel stays
# private.
#
# HTTPS, not plain HTTP: browsers treat http://<ip> as an insecure context and
# disable the camera, geolocation and the clipboard API. The certificate is
# self-signed (see SelfSignedCertificateGenerator) — on first visit each browser
# shows a warning that has to be accepted once.
#
# Placeholders __LISTEN_PORT__ / __HTTPS_PORT__ / __HTTPS_HOSTPORT__ /
# __BACKEND_PORT__ / __SSL_CERT__ / __SSL_KEY__ are substituted by
# install-nginx.ps1 when this file is deployed to <nginx>\conf\nginx.conf.
# ─────────────────────────────────────────────────────────────────────────────

# Run in the foreground as a single supervised process. Required when nginx is
# managed by a service wrapper (nssm): without this, nginx (no console under a
# Windows service) tries to daemonize, the launched process exits immediately, and
# nssm throttles the service into a "Paused" state.
daemon off;

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # Face/photo uploads go through the proxy — allow large bodies.
    client_max_body_size 50m;

    # WebSocket upgrade handling (SignalR /hubs/devices).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend upstream — Kestrel on loopback only.
    upstream projectx_backend {
        server 127.0.0.1:__BACKEND_PORT__;
        keepalive 32;
    }

    # Plain HTTP exists only to bounce old links and typed addresses to HTTPS.
    server {
        listen      __LISTEN_PORT__;
        listen      [::]:__LISTEN_PORT__;
        server_name _;
        return 301 https://__HTTPS_HOSTPORT__$request_uri;
    }

    server {
        listen      __HTTPS_PORT__ ssl;
        listen      [::]:__HTTPS_PORT__ ssl;
        http2       on;
        server_name _;

        ssl_certificate     __SSL_CERT__;
        ssl_certificate_key __SSL_KEY__;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # Real-time hub (WebSockets / Server-Sent Events). Long-lived, unbuffered.
        location /hubs/ {
            proxy_pass            http://projectx_backend;
            proxy_http_version    1.1;
            proxy_set_header      Upgrade           $http_upgrade;
            proxy_set_header      Connection        $connection_upgrade;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_buffering       off;
            proxy_cache           off;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }

        # API + SPA (everything else) → Kestrel, which serves wwwroot + SPA fallback.
        location / {
            proxy_pass            http://projectx_backend;
            proxy_http_version    1.1;
            proxy_set_header      Upgrade           $http_upgrade;
            proxy_set_header      Connection        $connection_upgrade;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
        }
    }
}
